<!DOCTYPE html>
<html lang="ru">
<head> 
    <script 
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sages | Игровое сообщество</title>
    <style>
        :root {
            --bg-color: #080503;
            --card-bg: rgba(18, 11, 8, 0.96);
            --primary-orange: #ff5500;
            --accent-glow: rgba(255, 85, 0, 0.3);
            --text-main: #ffffff;
            --text-muted: #c2b8b2;
            --border-color: rgba(255, 85, 0, 0.3);
            --success: #00e65b;
            --danger: #ff3344;
            
            /* Цвета ролей */
            --role-main-admin: #ff7700;
            --role-admin: #9933ff;
            --role-moderator: #0088ff;
            --role-sub: #00cc99;
            --role-pw: #00cc44;
            --role-member: #ffcc00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 50% 10%, rgba(255, 85, 0, 0.1) 0%, transparent 60%),
                linear-gradient(to bottom, #0a0604, #000000);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px 100px 10px;
            overflow-x: hidden;
        }

        .main-container {
            width: 100%;
            max-width: 1000px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9), 0 0 40px var(--accent-glow);
            backdrop-filter: blur(20px);
            margin-bottom: 10px;
        }

        @media (min-width: 850px) {
            .grid-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; align-items: start; }
            .full-width { grid-column: span 2; }
        }
        @media (max-width: 849px) {
            .grid-layout { display: flex; flex-direction: column; gap: 16px; }
        }

        .screen { display: none; animation: fadeIn 0.25s ease; }
        .screen.active { display: block; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .brand-header { text-align: center; margin-bottom: 20px; }
        .brand-header h1 { font-size: 42px; letter-spacing: 4px; color: var(--primary-orange); text-shadow: 0 0 20px rgba(255,85,0,0.6); font-weight: 900; margin-bottom: 4px; }
        .brand-header p { font-size: 12px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; font-weight: bold; }

        .card { background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 85, 0, 0.15); border-radius: 16px; padding: 18px; margin-bottom: 16px; }
        .card-title { font-size: 14px; font-weight: 800; color: var(--primary-orange); text-transform: uppercase; margin-bottom: 14px; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }

        .online-status-box { background: linear-gradient(145deg, rgba(0,255,100,0.08), rgba(0,0,0,0.6)); border: 1px solid rgba(0,255,100,0.25); padding: 14px 18px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; font-size: 15px; font-weight: bold; margin-bottom: 16px; }
        .online-dot { width: 12px; height: 12px; background-color: #00ff66; border-radius: 50%; box-shadow: 0 0 10px #00ff66; display: inline-block; transition: 0.3s; }
        .online-dot.offline { background-color: #555; box-shadow: none; }

        .audio-toggle-btn { background: rgba(255,85,0,0.15); border: 1px solid var(--primary-orange); color: #fff; font-size: 11px; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.2s; margin: 0; }
        .audio-toggle-btn.off { background: rgba(255,255,255,0.05); border-color: rgba(255,255,255,0.2); color: var(--text-muted); }

        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
        @media (max-width: 600px) { .stats-grid { grid-template-columns: 1fr 1fr; } }
        
        .stat-item { background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; text-align: center; border: 1px solid rgba(255,255,255,0.04); }
        .stat-val { font-size: 16px; font-weight: 900; color: #fff; margin-bottom: 4px; }
        .stat-lbl { font-size: 11px; color: var(--text-muted); line-height: 1.2; font-weight: bold; }

        .interactive-chart-box { border-top: 1px solid rgba(255,255,255,0.05); padding-top: 14px; position: relative; }
        .chart-bars-row { display: flex; align-items: flex-end; gap: 4px; height: 50px; margin-top: 8px; }
        .chart-bar-single { flex: 1; background: rgba(255,85,0,0.3); border-radius: 3px 3px 0 0; cursor: pointer; transition: 0.2s; }
        .chart-bar-single:hover { background: var(--primary-orange); }
        
        #chart-tooltip { position: absolute; background: rgba(10,5,3,0.98); border: 1px solid var(--primary-orange); padding: 10px 14px; border-radius: 8px; font-size: 13px; color: #fff; pointer-events: none; display: none; z-index: 9999; box-shadow: 0 5px 15px rgba(255,85,0,0.5); white-space: nowrap; font-weight: bold; }

        .pros-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        @media (max-width: 600px) { .pros-grid { grid-template-columns: 1fr; } }
        .pro-card { background: rgba(0,0,0,0.3); border: 1px solid rgba(255,85,0,0.15); padding: 14px; border-radius: 12px; }
        .pro-card h4 { font-size: 14px; color: #fff; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .pro-card p { font-size: 11px; color: var(--text-muted); line-height: 1.5; margin: 0; }

        .btn-action { display: block; width: 100%; padding: 14px; background: linear-gradient(135deg, #ff5500, #b32d00); color: white; border: none; border-radius: 12px; font-size: 14px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; text-align: center; transition: 0.2s; text-decoration: none; }
        .btn-action:hover { filter: brightness(1.15); transform: translateY(-1px); }
        .btn-danger { background: linear-gradient(135deg, #ff3344, #b30011); }
        .btn-success { background: linear-gradient(135deg, #00e65b, #00b347); box-shadow: 0 4px 15px rgba(0, 230, 91, 0.3); }

        .btn-social { width: 100%; padding: 12px; border-radius: 10px; font-size: 13px; font-weight: bold; border: 1px solid rgba(255,255,255,0.08); cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; color: white; text-decoration: none; transition: 0.2s; margin-bottom: 8px; }
        .btn-vk { background: linear-gradient(135deg, #0077ff, #0044aa); }
        .btn-discord { background: linear-gradient(135deg, #5865f2, #353fa0); }
        .btn-email { background: rgba(255,255,255,0.08); }
        .btn-social:hover { filter: brightness(1.2); }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 11px; color: var(--text-muted); margin-bottom: 6px; text-transform: uppercase; font-weight: bold; }
        .form-control { width: 100%; padding: 12px 14px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; color: white; font-size: 14px; outline: none; }
        .form-control:focus { border-color: var(--primary-orange); }

        .profile-card { display: flex; align-items: center; gap: 16px; background: rgba(0,0,0,0.4); padding: 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,0.05); }
        .avatar { width: 55px; height: 55px; border-radius: 50%; background: linear-gradient(135deg, #ff5500, #220a00); display: flex; align-items: center; justify-content: center; font-size: 24px; border: 2px solid var(--primary-orange); }
        .profile-info h3 { font-size: 18px; margin-bottom: 4px; color: #fff; display: flex; align-items: center; gap: 8px; margin-top: 0; }
        .profile-info p { font-size: 12px; color: var(--text-muted); margin: 2px 0; }

        .nav-bar { position: fixed; bottom: 0; left: 0; width: 100%; background: #060402; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; padding: 10px 0; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.8); }
        .nav-tab { background: none; border: none; color: var(--text-muted); font-size: 11px; font-weight: bold; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .nav-tab.active { color: var(--primary-orange); text-shadow: 0 0 10px rgba(255,85,0,0.4); }
        .nav-tab svg { width: 22px; height: 22px; fill: currentColor; }

        .footer-legal { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 5px; font-weight: bold; }

        .list-item { background: rgba(0,0,0,0.4); border: 1px solid rgba(255,165,0,0.2); padding: 14px; border-radius: 12px; margin-bottom: 10px; position: relative; font-size: 13px; transition: 0.2s; }
        .btn-close { position: absolute; top: 12px; right: 12px; background: var(--danger); color: #fff; border: none; border-radius: 6px; width: 24px; height: 24px; font-size: 12px; cursor: pointer; font-weight: bold; transition: 0.2s; display: flex; align-items: center; justify-content: center; }
        .btn-close:hover { filter: brightness(1.2); }
        .btn-small { padding: 8px 14px; font-size: 12px; border-radius: 8px; border: none; font-weight: bold; color: #fff; cursor: pointer; transition: 0.2s; margin: 0; }
        .btn-small:hover { filter: brightness(1.1); }
        .role-tag { padding: 4px 10px; border-radius: 6px; font-size: 11px; font-weight: bold; display: inline-block; margin-top: 6px; border: 1px solid; }
        
        .period-select-large { background: rgba(0,0,0,0.6); border: 1px solid var(--primary-orange); color: #fff; font-size: 13px; padding: 4px 10px; border-radius: 6px; outline: none; cursor: pointer; font-weight: bold; }
        .scrollable-list { max-height: 450px; overflow-y: auto; padding-right: 6px; }
        .scrollable-list::-webkit-scrollbar { width: 5px; }
        .scrollable-list::-webkit-scrollbar-thumb { background: var(--primary-orange); border-radius: 10px; }

        .btn-bonus-toggle { width: 100%; background: #00d636; color: #ffffff; border: none; border-radius: 10px; padding: 14px; margin-bottom: 10px; font-size: 13px; font-weight: 800; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; justify-content: flex-start; gap: 10px; transition: 0.2s; }
        .btn-bonus-toggle.off { background: #ff3344; box-shadow: 0 4px 15px rgba(255, 51, 68, 0.3); }
        .bonus-dot { width: 12px; height: 12px; border-radius: 50%; background: #aaffcc; box-shadow: inset 0 0 3px rgba(0,0,0,0.3); }
        .btn-bonus-toggle.off .bonus-dot { background: #ffaaaa; }
        
        .flex-between { display: flex; justify-content: space-between; align-items: center; }
        
        /* Блок индивидуальных настроек */
        .individual-perms-box { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 8px; margin-bottom: 10px; border: 1px dashed rgba(255,85,0,0.3); }
    </style>
</head>
<body>

    <!-- Глобальная тултипа для графиков -->
    <div id="chart-tooltip"></div>

    <div class="main-container">
        
        <!-- ЭКРАН 1: ГЛАВНАЯ -->
        <div id="screen-home" class="screen active">
            <div class="brand-header full-width">
                <h1>Sages</h1>
                <p>Элитное игровое сообщество</p>
            </div>

            <div class="grid-layout">
                <!-- ЛЕВАЯ КОЛОНКА -->
                <div>
                    <!-- Компактный блок статуса и аудио -->
                    <div class="online-status-box">
                        <div style="display:flex; align-items:center;">
                            <div class="online-dot"></div> 
                            <span style="margin-left: 8px;">Бойцов в сети: <span style="color:var(--success);">24</span></span>
                        </div>
                        <button class="audio-toggle-btn off" id="audio-toggle-switch" onclick="toggleGlobalAudio()">🎵 Звук: ВЫКЛ</button>
                    </div>

                    <div class="card">
                        <div class="card-title">
                            <span>📊 Детальная статистика</span>
                            <select class="period-select-large" id="stats-select" onchange="playSound(); updateStats()">
                                <option value="day">За день</option>
                                <option value="week">За неделю</option>
                                <option value="month" selected>За месяц</option>
                                <option value="year">За год</option>
                                <option value="all">За всё время</option>
                            </select>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-item"><div class="stat-val" id="stat-pc">~10.2К</div><div class="stat-lbl">💻 ПК</div></div>
                            <div class="stat-item"><div class="stat-val" id="stat-mob">~4.8К</div><div class="stat-lbl">📱 Смарт</div></div>
                            <div class="stat-item"><div class="stat-val" id="stat-tab">~2.7К</div><div class="stat-lbl">📟 Планшет</div></div>
                            <div class="stat-item"><div class="stat-val" id="stat-tv">~1.3К</div><div class="stat-lbl">📺 ТВ</div></div>
                        </div>

                        <div class="stats-grid" style="margin-bottom: 10px;">
                            <div class="stat-item"><div class="stat-val" id="stat-cr" style="color:var(--success);">+112</div><div class="stat-lbl">Создано</div></div>
                            <div class="stat-item"><div class="stat-val" id="stat-del" style="color:var(--danger);">-15</div><div class="stat-lbl">Удалено</div></div>
                            <div class="stat-item"><div class="stat-val" id="stat-ban" style="color:var(--primary-orange);">12</div><div class="stat-lbl">Банов</div></div>
                            <div class="stat-item"><div class="stat-val" id="stat-unban" style="color:var(--success);">8</div><div class="stat-lbl">Разбанов</div></div>
                        </div>

                        <div class="interactive-chart-box">
                            <div style="font-size: 11px; color: var(--text-muted); margin-bottom: 4px; font-weight: bold;">Активность (наведите для деталей):</div>
                            <div class="chart-bars-row" id="interactive-bars-grid-home"></div>
                        </div>
                    </div>
                </div>

                <!-- ПРАВАЯ КОЛОНКА -->
                <div>
                    <!-- БЫСТРЫЙ ВХОД -->
                    <div class="card" id="auth-box" style="margin-bottom: 24px;">
                        <div class="card-title">⚡ Быстрый вход в сообщество</div>
                        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 12px; line-height: 1.4;">
                            Авторизуйтесь, чтобы надежно сохранить профиль на этом устройстве.
                        </div>
                        <div>
                            <button class="btn-social btn-vk" onclick="instantLogin('VK ID')">💙 Войти через VK ID</button>
                            <button class="btn-social btn-discord" onclick="instantLogin('Discord')">🎮 Войти через Discord</button>
                            <button class="btn-social btn-email" style="margin-bottom: 0;" onclick="instantLogin('E-mail')">📧 Регистрация по E-mail</button>
                        </div>
                    </div>

                    <!-- Карточка профиля после входа -->
                    <div class="card" id="mini-profile-box" style="display: none; margin-bottom: 24px;">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div style="display: flex; gap: 12px; align-items: center;">
                                <div style="width: 44px; height: 44px; background: var(--primary-orange); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px;">⚡</div>
                                <div>
                                    <div style="font-weight: bold; font-size: 16px; color: #fff;" id="mini-nick">Ник</div>
                                    <div style="font-size: 11px; color: var(--text-muted); margin-top: 2px;" id="mini-status">Ожидает подтверждения</div>
                                </div>
                            </div>
                            <button class="btn-small" style="background: rgba(255,255,255,0.15); padding: 8px 14px;" onclick="logout()">Выйти</button>
                        </div>
                    </div>

                    <!-- ССЫЛКИ -->
                    <div class="card">
                        <div class="card-title">🌐 Наши ресурсы</div>
                        <div style="display: flex; gap: 8px; flex-wrap: wrap;">
                            <a href="https://vk.ru/sages_community" target="_blank" class="btn-action" style="flex: 1; margin: 0; padding: 12px; font-size: 12px; background: linear-gradient(135deg, #0077ff, #0044aa); box-shadow: none;">💬 Паблик VK</a>
                            <a href="https://discord.gg/snZnu42c7j" target="_blank" class="btn-action" style="flex: 1; margin: 0; padding: 12px; font-size: 12px; background: linear-gradient(135deg, #5865f2, #353fa0); box-shadow: none;">🎧 Discord</a>
                            <a href="https://vk.ru/armen4ick96" target="_blank" class="btn-action" style="flex: 1; margin: 0; padding: 12px; font-size: 12px; background: linear-gradient(135deg, #ff5500, #b32d00); box-shadow: none;">⚡ Мастер</a>
                        </div>
                    </div>

                    <!-- ПРЕИМУЩЕСТВА С ОБНОВЛЕННОЙ ЗАЩИТОЙ -->
                    <div class="card" style="margin-bottom: 0;">
                        <div class="card-title">🌟 Наши преимущества</div>
                        <div class="pros-grid">
                            <div class="pro-card">
                                <h4>🎁 Ценные призы</h4>
                                <p>Накапливайте Sages-Coins и получайте реальный шанс выиграть крутой мерч и эксклюзивные игровые бонусы.</p>
                            </div>
                            <div class="pro-card">
                                <h4>🛡️ Защита данных</h4>
                                <p>Надежная облачная High-Availability архитектура, полное <b>HTTPS-шифрование</b> трафика и безопасный вход.</p>
                            </div>
                            <div class="pro-card">
                                <h4>⚡ Поддержка</h4>
                                <p>Прямая связь с руководством штаба и помощь от опытных соратников в любых игровых вопросах.</p>
                            </div>
                            <div class="pro-card">
                                <h4>🤝 Элитный статус</h4>
                                <p>Признание, продвижение по ролям и глубокое уважение на всех ресурсах нашего проекта.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ЭКРАН 2: ЛИЧНЫЙ КАБИНЕТ -->
        <div id="screen-profile" class="screen">
            <div class="brand-header">
                <h1>Кабинет</h1>
                <p>Личный профиль участника</p>
            </div>
            
            <div class="grid-layout">
                <div>
                    <div class="profile-card" style="background: transparent; border: none; padding: 0; margin-bottom: 16px; flex-direction: column; align-items: flex-start; gap: 8px;">
                        <div style="display: flex; gap: 16px; align-items: center;">
                            <div class="avatar">⚡</div>
                            <div>
                                <h3 id="display-nick">Гость</h3>
                                <p id="profile-device-info">Устройство: Не определено</p>
                                <p id="profile-auth-status" style="font-weight: bold; color: var(--text-muted); margin-top: 4px;">Не авторизован</p>
                                <div id="profile-role-display"></div>
                            </div>
                        </div>
                    </div>

                    <div id="block-coins" class="card" style="text-align: center; background: rgba(255,85,0,0.05); border-color: rgba(255,85,0,0.2); margin-bottom: 24px;">
                        <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 4px; font-weight: bold;">БАЛАНС SAGES-COINS</div>
                        <div style="font-size: 34px; font-weight: 900; color: var(--primary-orange); text-shadow: 0 0 10px rgba(255,85,0,0.4);">50 <span style="font-size: 16px;">SC</span></div>
                    </div>
                    
                    <div class="card" style="background: rgba(255,140,0,0.05);">
                        <div class="card-title" style="color: #ffaa00;">🏆 Что такое Sages-Coin?</div>
                        <p style="font-size: 12px; color: #dcd6d2; line-height: 1.5; margin: 0;">
                            <b>Sages-Coin (SC)</b> — это внутренняя валюта активности нашего сообщества. Накапливая SC, вы получаете доступ к эксклюзивным наградам, фирменному мерчу и участвуете в закрытых ивентах.
                        </p>
                    </div>

                    <div class="card">
                        <div class="form-group">
                            <label>Ваш игровой позывной</label>
                            <input type="text" id="prof-nick" class="form-control" placeholder="Введите позывной...">
                        </div>
                        <div style="display:flex; gap:8px;">
                            <button class="btn-action" style="flex:1; margin:0; padding:12px;" onclick="saveProfile()">Сохранить позывной</button>
                            <button class="btn-action btn-danger" style="width: auto; padding: 12px 16px; margin:0;" onclick="deleteMyNick()">Удалить</button>
                        </div>
                    </div>
                </div>

                <div>
                    <div class="card" id="block-promos">
                        <div class="card-title">🎟️ Активация кода</div>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" class="form-control" placeholder="Вставьте код..." style="margin: 0; padding:12px;">
                            <button class="btn-action" style="width: auto; padding: 0 24px; margin: 0;" onclick="playSound(); alert('Код проверяется!')">ОК</button>
                        </div>
                    </div>

                    <div class="card" id="block-shop-user">
                        <div class="card-title">🎁 Обменник наград</div>
                        <div id="shop-container"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ЭКРАН 3: ПОДДЕРЖКА -->
        <div id="screen-cashback" class="screen">
            <div class="brand-header">
                <h1>Поддержка</h1>
                <p>Развитие сообщества Sages</p>
            </div>
            
            <div class="grid-layout">
                <div class="card" id="block-donate">

        function playSound() {
            if(!audioEnabled) return;
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.start(); osc.stop(audioCtx.currentTime + 0.1);
            } catch(e) {}
        }

        function startAmbient() {
            try {
                if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if(audioCtx.state === 'suspended') audioCtx.resume();
                if(!ambientInterval) {
                    ambientInterval = setInterval(() => {
                        if(!audioEnabled) return;
                        const osc = audioCtx.createOscillator();
                        const gain = audioCtx.createGain();
                        osc.type = 'sine';
                        osc.frequency.value = 200 + Math.random() * 50;
                        gain.gain.setValueAtTime(0.005, audioCtx.currentTime);
                        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 2);
                        osc.connect(gain); gain.connect(audioCtx.destination);
                        osc.start(); osc.stop(audioCtx.currentTime + 2);
                    }, 4000);
                }
            } catch(e){}
        }

                nick, provider, device, status: status, role: role, online: true, currentScreen: '👤 Кабинет',
                customPerms: { active: false, profile: true, support: true, admin: false }
            };
            
            localStorage.setItem('sages_user', JSON.stringify(currentUser));
            
            allUsersMock[nick] = currentUser;
            localStorage.setItem('sages_all_users', JSON.stringify(allUsersMock));

            if(!isMaster) {
                adminRequests.push(currentUser);
                localStorage.setItem('sages_requests', JSON.stringify(adminRequests));
            }

            dbStats.reg++;
            updateDbStats();

            document.querySelectorAll('.nav-tab').forEach(t => t.style.display = 'flex');

            checkAuthUI();
            renderAllUsersAdmin();
            switchTab('screen-profile', document.getElementById('tab-profile'), '👤 Кабинет');
            
            if(isMaster) {
                alert('С возвращением, Мастер! Вы вошли как Главный администратор.');
            } else {
                alert('Заявка на вход отправлена администратору.');
            }
        }

        function logout() {
            playSound();
            if(currentUser && allUsersMock[currentUser.nick]) {
                allUsersMock[currentUser.nick].online = false;
                allUsersMock[currentUser.nick].currentScreen = "Офлайн";
                localStorage.setItem('sages_all_users', JSON.stringify(allUsersMock));
            }
            currentUser = null;
            localStorage.removeItem('sages_user');
            
            checkAuthUI();
            renderAllUsersAdmin();
            switchTab('screen-home', document.getElementById('tab-home'), '🏠 Главная');
        }

        function checkAuthUI() {
            const authBox = document.getElementById('auth-box');
            const miniProf = document.getElementById('mini-profile-box');
            
            let currentPerms = rolePerms["Участник"]; 
            
            if(currentUser) {
                if(allUsersMock[currentUser.nick]) {
                    currentUser.status = allUsersMock[currentUser.nick].status;
                    currentUser.role = allUsersMock[currentUser.nick].role || 'Участник';
                    currentUser.customPerms = allUsersMock[currentUser.nick].customPerms || {active: false};
                }

                // Сначала берем права роли, затем перебиваем индивидуальными, если они активны
                currentPerms = { ...rolePerms[currentUser.role] };
                if (currentUser.customPerms && currentUser.customPerms.active) {
                    currentPerms.profile = currentUser.customPerms.profile;
                    currentPerms.support = currentUser.customPerms.support;
                    currentPerms.admin = currentUser.customPerms.admin;
                }

                currentActivePerms = currentPerms; // Сохраняем глобально для отрисовки интерфейса админки

                if(authBox) authBox.style.display = 'none';
                if(miniProf) {
                    miniProf.style.display = 'block';
                    document.getElementById('mini-nick').innerText = currentUser.nick;
                    document.getElementById('mini-status').innerText = `Статус: ${currentUser.status}`;
                    document.getElementById('mini-status').style.color = currentUser.status.includes('✅') ? 'var(--success)' : (currentUser.status.includes('❌') ? 'var(--danger)' : 'var(--primary-orange)');
                }
                
                document.getElementById('display-nick').innerText = currentUser.nick;
                document.getElementById('prof-nick').value = currentUser.nick;
                
                const statEl = document.getElementById('profile-auth-status');
                statEl.innerText = `Статус: ${currentUser.status}`;
                statEl.style.color = currentUser.status.includes('✅') ? 'var(--success)' : (currentUser.status.includes('❌') ? 'var(--danger)' : 'var(--primary-orange)');
                
                document.getElementById('profile-device-info').innerHTML = `Устройство: <b>${currentUser.device}</b> \vert{} Вход: ${currentUser.provider}`;
                
                const rCol = ROLES[currentUser.role] || ROLES["Участник"];
                document.getElementById('profile-role-display').innerHTML = `<div class="role-tag" style="background:${rCol}22; color:${rCol}; border:1px solid ${rCol};">${currentUser.role}</div>`;
            } else {
                currentActivePerms = rolePerms["Участник"];
                if(authBox) authBox.style.display = 'block';
                if(miniProf) miniProf.style.display = 'none';
                document.getElementById('display-nick').innerText = "Гость";
                document.getElementById('prof-nick').value = "";
                document.getElementById('profile-auth-status').innerText = "Не авторизован";
                document.getElementById('profile-auth-status').style.color = "var(--text-muted)";
                document.getElementById('profile-device-info').innerText = "Устройство: Не определено";
                document.getElementById('profile-role-display').innerHTML = "";
            }

            // Вкладки видны всегда (по запросу пользователя)
            document.querySelectorAll('.nav-tab').forEach(t => t.style.display = 'flex');

            // Блоки внутри админки скрываются если нет соответствующих прав у ТЕКУЩЕГО админа
            document.getElementById('admin-block-promo').style.display = currentActivePerms.createPromo ? 'block' : 'none';
            document.getElementById('admin-block-users').style.display = currentActivePerms.editUsers ? 'block' : 'none';
            document.getElementById('admin-block-bans').style.display = currentActivePerms.editUsers ? 'block' : 'none';
            document.getElementById('admin-block-reqs').style.display = currentActivePerms.editUsers ? 'block' : 'none';
            document.getElementById('admin-block-shop').style.display = currentActivePerms.editShop ? 'block' : 'none';
        }

        function saveProfile() {
            playSound();
            if(!currentUser) return alert('Сначала войдите в систему!');
            currentUser.nick = document.getElementById('prof-nick').value;
            localStorage.setItem('sages_user', JSON.stringify(currentUser));
            
            if(allUsersMock[currentUser.nick]) {
                allUsersMock[currentUser.nick].nick = currentUser.nick;
                localStorage.setItem('sages_all_users', JSON.stringify(allUsersMock));
            }
            
            checkAuthUI();
            alert('Позывной сохранен!');
        }

        function deleteUserDB(nick, isSelf = false) {
            playSound();
            if(!currentActivePerms.editUsers && !isSelf) return alert('Нет прав на удаление базы.');
            
            if(confirm(`Точно ПОЛНОСТЬЮ удалить профиль ${nick} из базы?`)) {
                delete allUsersMock[nick];
                localStorage.setItem('sages_all_users', JSON.stringify(allUsersMock));
                dbStats.del++;
                updateDbStats();
                
                if(isSelf || (currentUser && currentUser.nick === nick)) {
                    currentUser = null;
                    localStorage.removeItem('sages_user');
                    checkAuthUI();
                    renderAllUsersAdmin();
                    switchTab('screen-home', document.getElementById('tab-home'), '🏠 Главная');
                    alert('Профиль успешно удален из базы.');
                } else {
                    renderAllUsersAdmin();
                }
            }
        }

        function deleteMyNick() {
            if(!currentUser) return;
            deleteUserDB(currentUser.nick, true);
        }

        function claimCashback() {
            playSound();
            const sum = document.getElementById('input-donation').value;
            if(sum > 0) alert(`Спасибо за поддержку на ${sum} руб! SC начислены.`);
            document.getElementById('input-donation').value = '';
        }

        function loadRolePerms() {
            const role = document.getElementById('rbac-role-select').value;
            const perms = rolePerms[role];
            document.getElementById('perm-profile').checked = perms.profile;
            document.getElementById('perm-support').checked = perms.support;
            document.getElementById('perm-admin').checked = perms.admin;
            document.getElementById('perm-roles').checked = perms.roles;
            document.getElementById('perm-create-promo').checked = perms.createPromo;
            document.getElementById('perm-edit-users').checked = perms.editUsers;
            document.getElementById('perm-edit-shop').checked = perms.editShop;
        }

        function saveRolePerms() {
            playSound();
            const role = document.getElementById('rbac-role-select').value;
            rolePerms[role] = {
                profile: document.getElementById('perm-profile').checked,
                support: document.getElementById('perm-support').checked,
                admin: document.getElementById('perm-admin').checked,
                roles: document.getElementById('perm-roles').checked,
                createPromo: document.getElementById('perm-create-promo').checked,
                editUsers: document.getElementById('perm-edit-users').checked,
                editShop: document.getElementById('perm-edit-shop').checked
            };
            localStorage.setItem('sages_role_perms', JSON.stringify(rolePerms));
            checkAuthUI();
            renderAllUsersAdmin();
            alert(`Права для роли "${role}" успешно обновлены!`);
        }

        function createPromo() {
            playSound();
            const code = document.getElementById('admin-code-val').value;
            const desc = document.getElementById('admin-code-desc').value;
            promoList.push({ code, desc });
            renderPromos();
        }

        function renderPromos() {
            const cont = document.getElementById('admin-promos-list');
            if(!cont) return;
            if(promoList.length === 0) { cont.innerHTML = '<div class="list-item" style="text-align:center; font-size:13px;">Нет активных кодов</div>'; return; }
            let html = '';
            promoList.forEach((p, i) => {
                html += `
                    <div class="list-item">
                        <button class="btn-close" onclick="playSound(); promoList.splice(${i}, 1); renderPromos();">✕</button>
                        <div style="font-weight:bold; font-size:16px; color:var(--primary-orange); margin-bottom: 4px;">🎟️ ${p.code}</div>
                        <div style="font-size:12px; color:var(--text-muted);">${p.desc}</div>
                    </div>`;
            });
            cont.innerHTML = html;
        }

        function renderRequests() {
            const cont = document.getElementById('admin-requests-list');
            if(!cont) return;
            let reqs = adminRequests.filter(r => r.status.includes('Ожидает'));
            
            // Дизайн пустых заявок по скриншоту[span_5](start_span)[span_5](end_span)
            if(reqs.length === 0) { 
                cont.innerHTML = `
                    <div style="text-align:center; padding: 20px; background: rgba(0,0,0,0.5); border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); font-size: 13px;">
                        Нет заявок
                    </div>`; 
                return; 
            }
            
            let html = '';
            reqs.forEach((r, i) => {
                let origIdx = adminRequests.indexOf(r);
                html += `
                    <div class="list-item">
                        <button class="btn-close" onclick="playSound(); adminRequests.splice(${origIdx}, 1); localStorage.setItem('sages_requests', JSON.stringify(adminRequests)); renderRequests();">✕</button>
                        <div style="font-weight:bold; font-size:15px; margin-bottom: 8px;">👤 ${r.nick} <span style="font-size:11px; color:var(--text-muted); font-weight:normal;">(${r.provider})</span></div>
                        <div style="font-size:12px; color:var(--text-muted); margin-bottom:10px;">Устройство: <b>${r.device}</b></div>
                        <input type="text" id="rej-res-${origIdx}" class="form-control" style="padding:10px; font-size:13px; margin-bottom:10px;" placeholder="Причина отказа (необяз.)">
                        <div style="display:flex; gap:10px;">
                            <button class="btn-small" style="background:var(--success); font-size: 13px; width: 100%; padding: 10px;" onclick="modReq(${origIdx}, 'Подтверждено ✅', '')">Принять</button>
                            <button class="btn-small" style="background:var(--danger); font-size: 13px; width: 100%; padding: 10px;" onclick="modReq(${origIdx}, 'Отклонено ❌', document.getElementById('rej-res-${origIdx}').value)">Отказать</button>
                        </div>
                    </div>`;
            });
            cont.innerHTML = html;
        }

        function modReq(i, stat, reason) {
            playSound();
            const finalStat = reason ? `${stat} (Причина: ${reason})` : stat;
            adminRequests[i].status = finalStat;
            localStorage.setItem('sages_requests', JSON.stringify(adminRequests));
            
            if(allUsersMock[adminRequests[i].nick]) {
                allUsersMock[adminRequests[i].nick].status = finalStat;
                localStorage.setItem('sages_all_users', JSON.stringify(allUsersMock));
            }
            
            checkAuthUI();
            renderRequests();
            renderAllUsersAdmin();
        }

        // --- ИНДИВИДУАЛЬНЫЕ ПРАВА И БАН ЛИСТ ---
        function renderAllUsersAdmin() {
            const contActive = document.getElementById('admin-all-users-list');
            const contBanned = document.getElementById('admin-banned-list');
            if(!contActive || !contBanned) return;

            let htmlActive = '';
            let htmlBanned = '';
            let opts = Object.keys(ROLES).map(r => `<option value="${r}">${r}</option>`).join('');

            Object.keys(allUsersMock).forEach(k => {
                let u = allUsersMock[k];
                if(!u.customPerms) u.customPerms = {active: false, profile:true, support:true, admin:false};

                if(u.status.includes('Забанен')) {
                    htmlBanned += `
                        <div class="list-item" style="border: 1px solid rgba(255,51,68,0.4); background: rgba(255,51,68,0.05);">
                            <button class="btn-close" onclick="playSound(); deleteUserDB('${k}')" title="Полностью удалить из БД">✕</button>
                            <div style="font-weight:bold; font-size:15px; margin-bottom:8px; color:var(--danger);">⛔ ${u.nick}</div>
                            <div style="font-size:12px; color:var(--text-muted); margin-bottom:4px;">Статус: <b style="color:var(--danger);">${u.status}</b></div>
                            <div style="font-size:12px; color:var(--text-muted); margin-bottom:12px;">Устройство: <b>${u.device}</b></div>
                            <div style="display:flex; gap:10px;">
                                ${currentActivePerms.editUsers ? `<button class="btn-small" style="background:var(--success); flex:1; padding: 10px;" onclick="unbanUser('${k}')">Разбанить</button>` : ''}
                            </div>
                        </div>`;
                } 
                else if (u.status.includes('✅') || u.status.includes('❌')) {
                    let isOnline = u.online !== false;
                    let dotColor = isOnline ? '#00e65b' : '#555';
                    let rCol = ROLES[u.role] || ROLES["Участник"];
                    let currentScr = isOnline ? (u.currentScreen || 'На сайте') : 'Офлайн';
                    let stColor = u.status.includes('✅') ? 'var(--success)' : 'var(--danger)';

                    let roleSelect = currentActivePerms.roles ? `
                        <select class="form-control" style="padding:8px; font-size:12px; margin-bottom:10px;" onchange="changeRole('${k}', this.value)">
                            <option value="${u.role}" selected hidden>Изменить роль: ${u.role}</option>${opts}
                        </select>` : ``;

                    let buttons = '';
                    if(currentActivePerms.editUsers) buttons += `<button class="btn-small" style="background:var(--danger); flex:1; padding: 8px;" onclick="banUser('${k}')">Забанить</button>`;
                    if(currentActivePerms.roles) buttons += `<button class="btn-small" style="background:#555; flex:1; padding: 8px;" onclick="revokeRights('${k}')">Снять права</button>`;
                    if(currentActivePerms.roles) buttons += `<button class="btn-small" style="background:var(--primary-orange); flex:0.5; padding: 8px;" onclick="toggleIndPerms('${k}')">⚙️</button>`;

                    let indPermsBox = `
                        <div id="ind-perms-${k}" class="individual-perms-box" style="display:none;">
                            <div style="font-size:11px; color:var(--primary-orange); font-weight:bold; margin-bottom:6px;">ИНДИВИДУАЛЬНЫЕ ДОСТУПЫ:</div>
                            <label style="font-size:11px; color:#fff; display:flex; gap:6px;"><input type="checkbox" id="up-act-${k}" ${u.customPerms.active ? 'checked':''} onchange="document.getElementById('up-opts-${k}').style.display = this.checked ? 'block':'none'"> Включить персональные настройки</label>
                            <div id="up-opts-${k}" style="display:${u.customPerms.active ? 'block':'none'}; margin-top:8px;">
                                <label style="font-size:11px; color:#fff; display:flex; gap:6px;"><input type="checkbox" id="up-prof-${k}" ${u.customPerms.profile ? 'checked':''}> Кабинет</label>
                                <label style="font-size:11px; color:#fff; display:flex; gap:6px;"><input type="checkbox" id="up-supp-${k}" ${u.customPerms.support ? 'checked':''}> Поддержка</label>
                                <label style="font-size:11px; color:#fff; display:flex; gap:6px;"><input type="checkbox" id="up-admin-${k}" ${u.customPerms.admin ? 'checked':''}> Админка</label>
                            </div>
                            <button class="btn-small" style="background:var(--success); width:100%; margin-top:10px; padding:8px;" onclick="saveUserPerms('${k}')">Сохранить доступы</button>
                        </div>
                    `;

                    htmlActive += `
                        <div class="list-item">
                            <button class="btn-close" onclick="playSound(); deleteUserDB('${k}')" title="Полностью удалить из БД">✕</button>
                            <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom: 10px; padding-right: 30px;">
                                <div style="display:flex; align-items:center; gap:8px; font-weight:bold; font-size:14px;">
                                    <div class="online-dot ${isOnline ? '' : 'offline'}"></div>
                                    ${u.nick}
                                </div>
                                <div class="role-tag" style="background:${rCol}22; color:${rCol}; border:1px solid ${rCol}; margin:0;">${u.role}</div>
                            </div>
                            
                            <div style="font-size:11px; color:var(--text-muted); margin-bottom:4px;">Статус: <b style="color:${stColor};">${u.status}</b></div>
                            <div style="font-size:11px; color:var(--text-muted); margin-bottom:4px;">Устройство: <b>${u.device}</b></div>
                            <div style="font-size:11px; color:var(--text-muted); margin-bottom:10px;">Где сейчас: <b style="color:var(--primary-orange);">${currentScr}</b></div>
                            
                            ${roleSelect}
                            ${indPermsBox}

                            <div style="display:flex; gap:8px;">
                                ${buttons}
                            </div>
                        </div>`;
                }
            });

            contActive.innerHTML = htmlActive || '<div class="list-item" style="text-align:center; font-size:12px;">База участников пуста</div>';
            contBanned.innerHTML = htmlBanned || '<div class="list-item" style="text-align:center; font-size:12px;">Бан-лист пуст</div>';
        }

        function toggleIndPerms(k) {
            playSound();
            const el = document.getElementById(`ind-perms-${k}`);
            if(el) el.style.display = el.style.display === 'none' ? 'block' : 'none';
        }

        function saveUserPerms(nick) {
            playSound();
            if(allUsersMock[nick]) {
                allUsersMock[nick].customPerms = {
                    active: document.getElementById(`up-act-${nick}`).checked,
                    profile: document.getElementById(`up-prof-${nick}`).checked,
                    support: document.getElementById(`up-supp-${nick}`).checked,
                    admin: document.getElementById(`up-admin-${nick}`).checked
                };
                localStorage.setItem('sages_all_users', JSON.stringify(allUsersMock));
                alert(`Индивидуальные доступы для ${nick} сохранены!`);
                if(currentUser && currentUser.nick === nick) checkAuthUI();
                renderAllUsersAdmin();
            }
        }

        function banUser(nick) {
            playSound();
            let reason = prompt(`Заблокировать участника ${nick}?\nУкажите причину (или оставьте пустым):`, "");
            if(reason !== null) {
                allUsersMock[nick].status = reason ? `Забанен ⛔ (Причина: ${reason})` : 'Забанен ⛔';
                allUsersMock[nick].role = 'Заблокирован';
                allUsersMock[nick].online = false;
                allUsersMock[nick].currentScreen = 'Офлайн';
                
                localStorage.setItem('sages_all_users', JSON.stringify(allUsersMock));
                dbStats.ban++;
                updateDbStats();
                
                if(currentUser && currentUser.nick === nick) logout();
                else renderAllUsersAdmin();
            }
        }

        function unbanUser(nick) {
            playSound();
            let reason = prompt(`Разблокировать участника ${nick}?\nУкажите причину разбана (или оставьте пустым):`, "");
            if(reason !== null) {
                allUsersMock[nick].status = reason ? `Подтверждено ✅ (Разбанен: ${reason})` : 'Подтверждено ✅';
                allUsersMock[nick].role = 'Участник';
                
                localStorage.setItem('sages_all_users', JSON.stringify(allUsersMock));
                dbStats.unban++;
                updateDbStats();
                
                renderAllUsersAdmin();
            }
        }

        function revokeRights(nick) {
            playSound();
            if(allUsersMock[nick]) {
                allUsersMock[nick].role = "Участник";
                allUsersMock[nick].customPerms = {active: false}; // Сбрасываем инд. права
                localStorage.setItem('sages_all_users', JSON.stringify(allUsersMock));
                if(currentUser && currentUser.nick === nick) checkAuthUI();
                renderAllUsersAdmin();
                alert(`Права у ${nick} сняты. Роль изменена на "Участник".`);
            }
        }

        function changeRole(nick, role) {
            playSound();
            if(allUsersMock[nick]) {
                allUsersMock[nick].role = role;
                localStorage.setItem('sages_all_users', JSON.stringify(allUsersMock));
                if(currentUser && currentUser.nick === nick) checkAuthUI();
                renderAllUsersAdmin();
                alert(`Участнику ${nick} выдана роль: ${role}`);
            }
        }

        function renderShopBuilder() {
            const cont = document.getElementById('admin-shop-builder');
            if(!cont) return;
            let html = '';
            shopItems.forEach((item, i) => {
                const bg = item.active ? 'var(--success)' : 'var(--danger)';
                const txt = item.active ? 'ВКЛ' : 'ВЫКЛ';
                html += `
                    <div class="list-item">
                        <button class="btn-close" onclick="playSound(); shopItems.splice(${i},1); renderShopBuilder(); renderShop();">✕</button>
                        <div style="display:flex; gap:8px; margin-bottom:10px; padding-right: 35px;">
                            <input type="text" value="${item.name}" class="form-control" style="padding:10px; font-size:13px;" onchange="shopItems[${i}].name=this.value; renderShop();">
                            <input type="number" value="${item.price}" class="form-control" style="padding:10px; font-size:13px; width:90px;" onchange="shopItems[${i}].price=this.value; renderShop();">
                        </div>
                        <input type="text" value="${item.desc}" class="form-control" style="padding:10px; font-size:12px; margin-bottom:10px;" onchange="shopItems[${i}].desc=this.value; renderShop();">
                        <button class="btn-small" style="background:${bg}; width:100%; font-size:13px; padding:10px;" onclick="playSound(); shopItems[${i}].active=!shopItems[${i}].active; renderShopBuilder(); renderShop();">Статус отображения: ${txt}</button>
                    </div>`;
            });
            cont.innerHTML = html;
        }

        function addShopItem() { playSound(); shopItems.push({ id: Date.now(), name: "Новая награда", desc: "Описание", price: 100, active: true }); renderShopBuilder(); renderShop(); }

        function renderShop() {
            const cont = document.getElementById('shop-container');
            if(!cont) return;
            let html = '';
            shopItems.filter(i => i.active).forEach(item => {
                html += `
                    <div class="list-item flex-between" style="padding: 16px;">
                        <div style="padding-right: 15px;">
                            <div style="font-weight:bold; font-size:15px; color:#fff; margin-bottom:4px;">🎁 ${item.name}</div>
                            <div style="font-size:12px; color:var(--text-muted); line-height: 1.4;">${item.desc}<br><b style="color:var(--primary-orange);">Цена: ${item.price} SC</b></div>
                        </div>
                        <button class="btn-action" style="width: auto; padding: 12px 18px; font-size: 13px; margin-bottom: 0;" onclick="playSound(); alert('Награда получена!')">Взять</button>
                    </div>`;
            });
            if(!html) html = '<div style="text-align:center; font-size:12px; color:var(--danger); padding: 10px;">Магазин пуст</div>';
            cont.innerHTML = html;
        }

        function switchTab(id, el, screenName) {
            playSound();
            
            if(id === 'screen-admin' && !currentActivePerms.admin) {
                alert('У вас нет прав для доступа к Панели управления!');
                return;
            }
            if(id === 'screen-profile' && !currentActivePerms.profile) {
                alert('У вас отключен доступ к Личному кабинету!');
                return;
            }
            if(id === 'screen-cashback' && !currentActivePerms.support) {
                alert('У вас отключен доступ к разделу Поддержки!');
                return;
            }

            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');

            if(currentUser) {
                currentUser.currentScreen = screenName;
                localStorage.setItem('sages_user', JSON.stringify(currentUser));
                if(allUsersMock[currentUser.nick]) {
                    allUsersMock[currentUser.nick].currentScreen = screenName;
                    localStorage.setItem('sages_all_users', JSON.stringify(allUsersMock));
                }
            }

            if(id === 'screen-admin') { renderPromos(); renderRequests(); renderAllUsersAdmin(); renderShopBuilder(); }
        } 
    </script> 
</body>
</html>
